# pyscn configuration file
# This file configures all analysis features of pyscn
# Place this file in your project root to customize analysis behavior

[output]
format = "text"
show_details = false
sort_by = "complexity"
min_complexity = 1

[complexity]
enabled = true
low_threshold = 9
medium_threshold = 19
max_complexity = 0
report_unchanged = true

[dead_code]
enabled = true
min_severity = "warning"
show_context = false
context_lines = 3
sort_by = "severity"
detect_after_return = true
detect_after_break = true
detect_after_continue = true
detect_after_raise = true
detect_unreachable_branches = true
ignore_patterns = []

[clones]
min_lines = 10
min_nodes = 20
max_edit_distance = 50
ignore_literals = false
ignore_identifiers = false
cost_model_type = "python"
type1_threshold = 0.85
type2_threshold = 0.75
type3_threshold = 0.7
type4_threshold = 0.65
similarity_threshold = 0.65
enable_dfa = true
min_similarity = 0.0
max_similarity = 1.0
max_results = 10000
grouping_mode = "connected"
grouping_threshold = 0.65
k_core_k = 2
lsh_enabled = "auto"
lsh_auto_threshold = 500
lsh_similarity_threshold = 0.5
lsh_bands = 32
lsh_rows = 4
lsh_hashes = 128
max_memory_mb = 100
batch_size = 100
enable_batching = true
max_goroutines = 4
timeout_seconds = 300
show_details = false
show_content = false
sort_by = "similarity"
group_clones = true

[cbo]
enabled = true
low_threshold = 3
medium_threshold = 7
include_builtins = false
include_imports = true
min_cbo = 0
show_zeros = false

[analysis]
recursive = true
follow_symlinks = false
include_patterns = ["**/*.py"]
exclude_patterns = [
    "**/test_*.py",
    "**/*_test.py",
    "**/__pycache__/*",
    "**/*.pyc",
    "**/.pytest_cache/",
    ".tox/",
    "venv/",
    "env/",
    ".venv/",
    ".env/",
    "**/migrations/**",
    "embedders/**",
    "utilities/**",
    "data/**",
    "mapping/**",
]

# Architecture validation - tuned for Classifast
[architecture]
enabled = true
validate_layers = true
strict_mode = true

[[architecture.layers]]
name = "presentation"
packages = ["router", "routers", "web", "templates", "static", "assets"]

[[architecture.layers]]
name = "application"
packages = ["service", "services", "classifier", "classifier_config"]

[[architecture.layers]]
name = "domain"
packages = ["models", "schemas", "cache_profiles", "mapping_store"]

[[architecture.layers]]
name = "infrastructure"
packages = ["cache", "storage", "dependencies", "clerk_auth", "payments", "usage_tracker"]

[[architecture.rules]]
from = "presentation"
allow = ["presentation", "application", "domain", "infrastructure"]

[[architecture.rules]]
from = "application"
allow = ["application", "domain", "infrastructure"]

[[architecture.rules]]
from = "domain"
allow = ["domain"]
deny = ["presentation", "application", "infrastructure"]

[[architecture.rules]]
from = "infrastructure"
allow = ["infrastructure", "domain"]
deny = ["presentation", "application"]
